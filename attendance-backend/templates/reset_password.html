<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Dutipay</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/DOG.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8faf5;
            --bg-card: #ffffff;
            --primary: #4a7c59;
            --primary-dark: #3d6647;
            --text-primary: #2d3e2d;
            --text-secondary: #5a6b5a;
            --text-muted: #8a9a8a;
            --border: #e0e7d5;
            --accent-red: #c45c4a;
        }
        [data-theme="dark"] {
            --bg-primary: #0f1a0f;
            --bg-card: #1e2e1e;
            --primary: #6b9e7a;
            --primary-dark: #4a7c59;
            --text-primary: #e8f0e0;
            --text-secondary: #b0c0a0;
            --text-muted: #7a8a70;
            --border: #2a3a2a;
            --accent-red: #e07060;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 440px; }
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(74, 124, 89, 0.15);
            border: 1px solid var(--border);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
        }
        .header { text-align: center; margin-bottom: 28px; }

        /* ✅ Logo styling */
        .auth-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(74, 124, 89, 0.15));
            animation: logoFadeIn 0.6s ease;
        }

        @keyframes logoFadeIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header h1 { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; }
        .header p { color: var(--text-secondary); font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%; padding: 14px 48px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 12px; font-size: 14px;
            color: var(--text-primary); font-family: inherit;
            transition: all 0.3s;
        }
        .input-wrapper input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 124, 89, 0.1);
        }
        .input-icon {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted); font-size: 16px;
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.3s;
        }
        .password-toggle:hover { color: var(--primary); }
        .btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; font-family: inherit; transition: all 0.3s;
            margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74, 124, 89, 0.35); }
        .alert {
            padding: 14px 18px; border-radius: 10px; margin-bottom: 20px;
            font-size: 13px; display: flex; align-items: flex-start;
            gap: 10px; line-height: 1.6;
        }
        .alert-error {
            background: rgba(196, 92, 74, 0.1); color: var(--accent-red);
            border: 1px solid rgba(196, 92, 74, 0.2);
        }
        .footer-link {
            text-align: center; margin-top: 24px; padding-top: 24px;
            border-top: 1px solid var(--border); font-size: 14px;
            color: var(--text-secondary);
        }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="/login" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>

            <div class="header">
                <img src="{{ url_for('static', filename='images/DOG.png') }}"
                     alt="Dutipay — Track time. Pay right."
                     class="auth-logo">
                <h1>Set New Password</h1>
                <p>Choose a strong password to secure your account</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/reset-password">
                <input type="hidden" name="token" value="{{ token }}">

                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" name="new_password" id="newPassword" placeholder="Minimum 6 characters" required minlength="6" autofocus>
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword', 'eyeIcon1')">
                            <i class="fas fa-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" name="confirm_password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                            <i class="fas fa-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-check"></i> Update Password
                </button>
            </form>

            <div class="footer-link">
                Remember your password? <a href="/login">Login here</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        function togglePassword(fieldId, iconId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.querySelector('form').addEventListener('submit', function(e) {
            const newPass = document.querySelector('input[name="new_password"]').value;
            const confirmPass = document.querySelector('input[name="confirm_password"]').value;
            if (newPass !== confirmPass) {
                e.preventDefault();
                alert('❌ Passwords do not match!');
            }
        });
    </script>
</body>
</html>
