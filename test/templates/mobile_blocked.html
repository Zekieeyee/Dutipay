<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Not Available on Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8faf5, #e8f0e0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .blocked-card {
            background: white;
            padding: 48px 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(74, 124, 89, 0.15);
            animation: slideUp 0.5s ease;
        }
        .blocked-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
        }
        .blocked-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: #2d3e2d;
            margin-bottom: 12px;
        }
        .blocked-card p {
            color: #5a6b5a;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .blocked-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4a7c59, #3d6647);
            color: white;
            box-shadow: 0 4px 20px rgba(74, 124, 89, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(74, 124, 89, 0.4);
        }
        .btn-secondary {
            background: #f0f4e8;
            color: #4a7c59;
            border: 1px solid #e0e7d5;
        }
        .btn-secondary:hover {
            background: #e8f0e0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="blocked-card">
    <img src="{{ url_for('static', filename='images/DOG.png') }}"
         alt="Dutipay" style="max-width: 160px; margin-bottom: 20px;">
    <span class="blocked-icon">💻</span>
        <h1>Scanner Not Available on Mobile</h1>
        <p>
            The QR scanner is only accessible on <strong>laptop or desktop</strong> 
            for security and compatibility reasons. Please use a computer to 
            scan attendance.
        </p>
        <div class="blocked-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="/login" class="btn btn-secondary">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
