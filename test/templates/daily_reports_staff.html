{% extends "base.html" %}

{% block title %}My Daily Reports{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📄 My Daily Reports</h1>
    <p class="subtitle">Submit and manage your daily work reports</p>
</div>

<!-- Submit Button -->
<div style="margin-bottom: 20px;">
    <button class="btn btn-primary" onclick="openSubmitModal()">
        <i class="fas fa-plus"></i> Submit New Report
    </button>
</div>

<!-- Filter Card -->
<div class="card">
    <div class="card-header">
        <h3>🔍 Filter</h3>
    </div>
    <div class="card-body">
        <div class="form-row">
            <div class="form-group">
                <label>From Date</label>
                <input type="date" id="filterDateFrom">
            </div>
            <div class="form-group">
                <label>To Date</label>
                <input type="date" id="filterDateTo">
            </div>
            <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <button class="btn btn-primary" onclick="loadReports()">
                    <i class="fas fa-search"></i> Apply
                </button>
                <button class="btn btn-secondary" onclick="resetFilter()">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Reports List -->
<div class="card">
    <div class="card-header">
        <h3>📋 My Reports</h3>
        <span class="badge badge-info" id="reportCount">0 reports</span>
    </div>
    <div class="card-body">
        <div id="reportsContainer">
            <p style="text-align:center;color:var(--text-muted);">Loading...</p>
        </div>
    </div>
</div>

<!-- Submit / Edit Modal -->
<div id="reportModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 620px;">
        <div class="modal-header">
            <h3 id="reportModalTitle">📝 Submit Daily Report</h3>
            <button class="modal-close" onclick="closeReportModal()">&times;</button>
        </div>
        <form id="reportForm" onsubmit="saveReport(event)" enctype="multipart/form-data">
            <input type="hidden" id="reportId">

            <div class="form-group">
                <label>Report Date *</label>
                <input type="date" id="reportDate" required>
            </div>

            <div class="form-group">
                <label>✅ Tasks Completed *</label>
                <textarea id="tasksCompleted" rows="3" required
                          placeholder="What tasks did you complete today?"
                          style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; background: var(--bg-card); color: var(--text-primary); width: 100%;"></textarea>
            </div>

            <div class="form-group">
                <label>⏳ Tasks In Progress</label>
                <textarea id="tasksInProgress" rows="2"
                          placeholder="What tasks are still in progress?"
                          style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; background: var(--bg-card); color: var(--text-primary); width: 100%;"></textarea>
            </div>

            <div class="form-group">
                <label>⚠️ Issues / Blockers</label>
                <textarea id="issuesBlockers" rows="2"
                          placeholder="Any issues or blockers at work?"
                          style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; background: var(--bg-card); color: var(--text-primary); width: 100%;"></textarea>
            </div>

            <div class="form-group">
                <label>➡️ Next Steps</label>
                <textarea id="nextSteps" rows="2"
                          placeholder="What are your plans for the next day?"
                          style="padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; background: var(--bg-card); color: var(--text-primary); width: 100%;"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>⏱️ Hours Worked</label>
                    <input type="number" id="hoursWorked" step="0.1" min="0" max="24" placeholder="8.0">
                </div>
                <div class="form-group">
                    <label>📎 Attachment (optional)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="reportAttachment" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                        <label for="reportAttachment" class="file-upload-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span id="attachmentLabel">Click to upload (PDF, DOC, JPG, PNG)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="existingAttachmentBox" style="display: none; padding: 10px 14px; background: var(--bg-secondary); border-radius: 8px; font-size: 13px; margin-bottom: 12px;">
                <i class="fas fa-paperclip"></i>
                Existing: <span id="existingAttachmentName" style="font-weight: 600;"></span>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn" onclick="closeReportModal()" style="background: var(--bg-secondary); color: var(--text-secondary);">
                    Cancel
                </button>
                <button type="submit" class="btn btn-success" id="reportSubmitBtn">
                    <i class="fas fa-save"></i> Submit Report
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.report-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    transition: all 0.3s;
}
.report-card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow);
}
.report-card.reviewed {
    background: linear-gradient(90deg, rgba(107,142,35,0.04), transparent);
    border-left: 3px solid var(--accent-green);
}
.report-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
}
.report-date {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.report-section {
    margin-bottom: 12px;
}
.report-section:last-child { margin-bottom: 0; }
.report-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.report-content {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.report-feedback {
    background: rgba(74,124,89,0.08);
    border-left: 3px solid var(--primary);
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 14px;
    font-size: 13px;
}
.report-feedback .label {
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.report-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}
.file-upload-wrapper {
    position: relative;
}
.file-upload-wrapper input[type="file"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    top: 0;
    left: 0;
}
.file-upload-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-primary);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    font-size: 13px;
    min-height: 46px;
}
.file-upload-label:hover {
    border-color: var(--primary);
    background: var(--bg-secondary);
    color: var(--primary);
}
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}
.empty-state i {
    font-size: 56px;
    opacity: 0.3;
    margin-bottom: 16px;
    display: block;
    color: var(--primary);
}
.reviewed-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}
.reviewed-badge.yes {
    background: rgba(107,142,35,0.15);
    color: var(--accent-green);
}
.reviewed-badge.no {
    background: rgba(233,196,106,0.2);
    color: #b8860b;
}
</style>

<script>
let currentReports = [];

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded', () => {
    // Set default filter — this month
    const today = new Date();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    setDateValue('filterDateFrom', monthStart);
    setDateValue('filterDateTo', today);

    // Set default report date when modal opens
    document.getElementById('reportDate').value = toISO(today);

    // Attachment label updater
    const att = document.getElementById('reportAttachment');
    if (att) {
        att.addEventListener('change', e => {
            const f = e.target.files[0];
            if (f) document.getElementById('attachmentLabel').textContent = f.name;
        });
    }

    loadReports();
});

// =============================================
// HELPERS
// =============================================
function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function setDateValue(id, d) {
    const el = document.getElementById(id);
    if (el) el.value = toISO(d);
}
function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function fmtDate(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(iso + 'T00:00:00');
        return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    } catch(e) { return iso; }
}

// =============================================
// LOAD REPORTS
// =============================================
async function loadReports() {
    const container = document.getElementById('reportsContainer');
    container.innerHTML = '<p style="text-align:center;color:var(--text-muted);">Loading...</p>';

    try {
        const params = new URLSearchParams();
        const from = document.getElementById('filterDateFrom').value;
        const to = document.getElementById('filterDateTo').value;
        if (from) params.append('date_from', from);
        if (to) params.append('date_to', to);

        const res = await fetch(`/api/daily-reports?${params.toString()}`);

// ✅ Handle HTTP errors before JSON parsing
if (!res.ok) {
    let errorMsg = `HTTP ${res.status}`;
    try {
        const errData = await res.json();
        errorMsg = errData.message || errorMsg;
    } catch (e) {
        // Ignore JSON parse error
    }
    container.innerHTML = `<p style="text-align:center;color:var(--accent-red);">
        <i class="fas fa-exclamation-triangle"></i> Server error: ${escapeHtml(errorMsg)}<br>
        <small style="color:var(--text-muted);">Please refresh the page or try again later.</small>
    </p>`;
    return;
}

const data = await res.json();

if (!data.success) {
    container.innerHTML = `<p style="text-align:center;color:var(--accent-red);">Error: ${escapeHtml(data.message)}</p>`;
    return;
}

        currentReports = data.data || [];
        document.getElementById('reportCount').textContent = `${currentReports.length} report(s)`;

        if (!currentReports.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>You don't have any daily reports yet..</p>
                    <p style="font-size: 13px; margin-top: 4px;">Click <strong>Submit New Report</strong> to add one.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = currentReports.map(r => renderReportCard(r)).join('');
    } catch (e) {
        container.innerHTML = `<p style="text-align:center;color:var(--accent-red);">Error: ${escapeHtml(e.message)}</p>`;
    }
}

function renderReportCard(r) {
    const reviewed = !!r.reviewed_at;
    const reviewedBadge = reviewed
        ? `<span class="reviewed-badge yes"><i class="fas fa-check-circle"></i> Reviewed</span>`
        : `<span class="reviewed-badge no"><i class="fas fa-clock"></i> Pending Review</span>`;

    const attachment = r.attachment_filename
        ? `<div class="report-section">
             <div class="report-label"><i class="fas fa-paperclip"></i> Attachment</div>
             <button class="btn btn-sm btn-info" onclick="viewAttachment(${r.id})">
                <i class="fas fa-download"></i> ${escapeHtml(r.attachment_filename)}
             </button>
           </div>`
        : '';

    const feedbackBlock = reviewed
        ? `<div class="report-feedback">
             <div class="label"><i class="fas fa-comment-dots"></i> Feedback from ${escapeHtml(r.reviewer_name || 'Reviewer')}</div>
             <div>${escapeHtml(r.feedback || 'No comment.')}</div>
             <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
                Reviewed on ${new Date(r.reviewed_at).toLocaleString()}
             </div>
           </div>`
        : '';

    return `
        <div class="report-card ${reviewed ? 'reviewed' : ''}">
            <div class="report-header">
                <div class="report-date">
                    <i class="fas fa-calendar-alt" style="color: var(--primary);"></i>
                    ${escapeHtml(fmtDate(r.report_date))}
                </div>
                ${reviewedBadge}
            </div>

            <div class="report-section">
                <div class="report-label"><i class="fas fa-check-circle" style="color: var(--accent-green);"></i> Tasks Completed</div>
                <div class="report-content">${escapeHtml(r.tasks_completed || '—')}</div>
            </div>

            ${r.tasks_in_progress ? `
            <div class="report-section">
                <div class="report-label"><i class="fas fa-hourglass-half" style="color: #b8860b;"></i> Tasks In Progress</div>
                <div class="report-content">${escapeHtml(r.tasks_in_progress)}</div>
            </div>` : ''}

            ${r.issues_blockers ? `
            <div class="report-section">
                <div class="report-label"><i class="fas fa-exclamation-triangle" style="color: var(--accent-red);"></i> Issues / Blockers</div>
                <div class="report-content">${escapeHtml(r.issues_blockers)}</div>
            </div>` : ''}

            ${r.next_steps ? `
            <div class="report-section">
                <div class="report-label"><i class="fas fa-arrow-right" style="color: var(--primary);"></i> Next Steps</div>
                <div class="report-content">${escapeHtml(r.next_steps)}</div>
            </div>` : ''}

            ${r.hours_worked ? `
            <div class="report-section">
                <div class="report-label"><i class="fas fa-clock"></i> Hours Worked</div>
                <div class="report-content"><strong>${r.hours_worked} hours</strong></div>
            </div>` : ''}

            ${attachment}
            ${feedbackBlock}

            <div class="report-actions">
                <button class="btn btn-sm btn-warning" onclick='editReport(${r.id})'>
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button class="btn btn-sm btn-danger" onclick='deleteReport(${r.id})'>
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        </div>
    `;
}

// =============================================
// SUBMIT MODAL
// =============================================
function openSubmitModal() {
    document.getElementById('reportId').value = '';
    document.getElementById('reportModalTitle').textContent = '📝 Submit Daily Report';
    document.getElementById('reportForm').reset();
    document.getElementById('reportDate').value = toISO(new Date());
    document.getElementById('attachmentLabel').textContent = 'Click to upload (PDF, DOC, JPG, PNG)';
    document.getElementById('existingAttachmentBox').style.display = 'none';
    document.getElementById('reportSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Submit Report';
    document.getElementById('reportModal').style.display = 'flex';
}

function closeReportModal() {
    document.getElementById('reportModal').style.display = 'none';
}

async function saveReport(e) {
    e.preventDefault();

    const id = document.getElementById('reportId').value;
    const isEdit = !!id;

    if (!confirm(isEdit ? '💾 Save changes to this report?' : '📤 Submit this daily report?')) return;

    const formData = new FormData();
    formData.append('report_date', document.getElementById('reportDate').value);
    formData.append('tasks_completed', document.getElementById('tasksCompleted').value);
    formData.append('tasks_in_progress', document.getElementById('tasksInProgress').value);
    formData.append('issues_blockers', document.getElementById('issuesBlockers').value);
    formData.append('next_steps', document.getElementById('nextSteps').value);
    formData.append('hours_worked', document.getElementById('hoursWorked').value || 0);

    const fileInput = document.getElementById('reportAttachment');
    if (fileInput.files[0]) {
        if (fileInput.files[0].size > 10 * 1024 * 1024) {
            alert('❌ Attachment too large. Max 10MB.');
            return;
        }
        formData.append('attachment', fileInput.files[0]);
    }

    try {
        const btn = document.getElementById('reportSubmitBtn');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        const url = isEdit ? `/api/daily-reports/${id}` : '/api/daily-reports';
        const method = isEdit ? 'PUT' : 'POST';

        let res;
        if (isEdit) {
            // Edit uses JSON (no file change in edit mode)
            const jsonData = {
                report_date: document.getElementById('reportDate').value,
                tasks_completed: document.getElementById('tasksCompleted').value,
                tasks_in_progress: document.getElementById('tasksInProgress').value,
                issues_blockers: document.getElementById('issuesBlockers').value,
                next_steps: document.getElementById('nextSteps').value,
                hours_worked: document.getElementById('hoursWorked').value || 0
            };
            res = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonData)
            });
        } else {
            res = await fetch(url, { method: 'POST', body: formData });
        }

        const result = await res.json();

        btn.disabled = false;
        btn.innerHTML = original;

        if (result.success) {
            alert('✅ ' + result.message);
            closeReportModal();
            loadReports();
        } else {
            alert('❌ ' + result.message);
        }
    } catch (e) {
        alert('❌ Error: ' + e.message);
    }
}

// =============================================
// EDIT
// =============================================
function editReport(id) {
    const r = currentReports.find(x => x.id === id);
    if (!r) return;

    document.getElementById('reportId').value = id;
    document.getElementById('reportModalTitle').textContent = '✏️ Edit Daily Report';
    document.getElementById('reportDate').value = r.report_date || '';
    document.getElementById('tasksCompleted').value = r.tasks_completed || '';
    document.getElementById('tasksInProgress').value = r.tasks_in_progress || '';
    document.getElementById('issuesBlockers').value = r.issues_blockers || '';
    document.getElementById('nextSteps').value = r.next_steps || '';
    document.getElementById('hoursWorked').value = r.hours_worked || '';
    document.getElementById('attachmentLabel').textContent = 'Click to replace attachment';
    document.getElementById('reportSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Changes';

    // Show existing attachment info
    if (r.attachment_filename) {
        document.getElementById('existingAttachmentBox').style.display = 'block';
        document.getElementById('existingAttachmentName').textContent = r.attachment_filename;
    } else {
        document.getElementById('existingAttachmentBox').style.display = 'none';
    }

    document.getElementById('reportModal').style.display = 'flex';
}

// =============================================
// DELETE
// =============================================
async function deleteReport(id) {
    const r = currentReports.find(x => x.id === id);
    if (!r) return;
    if (!confirm(`🗑️ Delete this report from ${fmtDate(r.report_date)}?\n\nThis cannot be undone.`)) return;

    try {
        const res = await fetch(`/api/daily-reports/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
            alert('✅ Report deleted.');
            loadReports();
        } else {
            alert('❌ ' + result.message);
        }
    } catch (e) {
        alert('❌ Error: ' + e.message);
    }
}

// =============================================
// VIEW ATTACHMENT
// =============================================
async function viewAttachment(id) {
    try {
        const res = await fetch(`/api/daily-reports/${id}/attachment`);
        const data = await res.json();
        if (data.success && data.data && data.data.url) {
            window.open(data.data.url, '_blank');
        } else {
            alert('❌ ' + (data.message || 'No attachment'));
        }
    } catch (e) {
        alert('❌ Error: ' + e.message);
    }
}

// =============================================
// RESET FILTER
// =============================================
function resetFilter() {
    const today = new Date();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    setDateValue('filterDateFrom', monthStart);
    setDateValue('filterDateTo', today);
    loadReports();
}
</script>
{% endblock %}
